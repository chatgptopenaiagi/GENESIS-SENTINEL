name: Linux verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build setuptools wheel
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_acceptance.py --wheel dist/*.whl --output ci-acceptance.json
      - run: python tools/build_release.py --skip-python-build --platform linux-x86_64
      - name: Install offline Linux x86_64 bundle
        run: |
          mkdir "$RUNNER_TEMP/genesis-bundle"
          tar -xzf dist/genesis-sentinel-0.1.0-linux-x86_64.tar.gz -C "$RUNNER_TEMP/genesis-bundle"
          "$RUNNER_TEMP/genesis-bundle/genesis-sentinel-0.1.0/install.sh" --python "$(command -v python)" --prefix "$RUNNER_TEMP/genesis-installed"
          "$RUNNER_TEMP/genesis-installed/bin/genesis-sentinel" --version
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python-version }}
          path: |
            ci-acceptance.json
            dist/genesis-sentinel-0.1.0-linux-x86_64.tar.gz
