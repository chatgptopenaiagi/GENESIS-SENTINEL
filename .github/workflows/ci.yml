name: Linux verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build setuptools wheel
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python tools/release_acceptance.py --wheel dist/*.whl --output ci-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python-version }}
          path: ci-acceptance.json
